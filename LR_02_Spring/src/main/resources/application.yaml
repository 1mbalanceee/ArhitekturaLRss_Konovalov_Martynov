spring:
  application:
    name: jewelry-spring
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jewelry}
    username: ${DB_USER:jewelry}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: never
  thymeleaf:
    encoding: UTF-8
  messages:
    encoding: UTF-8
  web:
    locale: ru_RU
    locale-resolver: fixed
server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
